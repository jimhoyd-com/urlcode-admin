name: verify
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: admin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jimhoyd-com/urlcode
          ref: 6490e291cefc7abc6a3de39b7d9eabc854189d45
          path: core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jimhoyd-com/urlcode-auth
          ref: 3f267fc6511679418130d8e3ebeace6dbaacbf77
          token: ${{ secrets.URLCODE_AUTH_READ_TOKEN }}
          path: auth
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jimhoyd-com/urlcode-ui
          ref: f76a5924495f8aa81165bc95624f7fe472de4298
          token: ${{ secrets.URLCODE_UI_READ_TOKEN }}
          path: ui
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
        working-directory: core
      - run: npm run build
        working-directory: core
      - run: npm ci --ignore-scripts
        working-directory: ui
      - run: npm run verify
        working-directory: ui
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: auth
      - working-directory: auth
        run: node --input-type=module -e "import {mkdir,symlink} from 'node:fs/promises'; await mkdir('node_modules/@jimhoyd',{recursive:true}); await symlink(process.env.GITHUB_WORKSPACE+'/core','node_modules/@jimhoyd/urlcode','dir'); await symlink(process.env.GITHUB_WORKSPACE+'/ui','node_modules/@jimhoyd/urlcode-ui','dir');"
      - run: npm run build
        working-directory: auth
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: admin
      - working-directory: admin
        run: node --input-type=module -e "import {mkdir,symlink} from 'node:fs/promises'; await mkdir('node_modules/@jimhoyd',{recursive:true}); await symlink(process.env.GITHUB_WORKSPACE+'/core','node_modules/@jimhoyd/urlcode','dir'); await symlink(process.env.GITHUB_WORKSPACE+'/ui','node_modules/@jimhoyd/urlcode-ui','dir'); await symlink(process.env.GITHUB_WORKSPACE+'/auth','node_modules/@jimhoyd/urlcode-auth','dir');"
      - run: npm run verify
        working-directory: admin
      - run: npm pack --ignore-scripts --dry-run
        working-directory: admin
